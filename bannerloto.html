<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to Lô Tô Show</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: black;
      color: gold;
      font-family: 'Arial Black', sans-serif;
      overflow: hidden;
      text-align: center;
    }
    .banner {
      position: relative;
      z-index: 1;
      padding: 100px 20px;
    }
    .banner h1 {
      font-size: 3em;
      margin: 0.2em 0;
      animation: glow 2s infinite alternate;
    }
    @keyframes glow {
      from { text-shadow: 0 0 10px gold; }
      to { text-shadow: 0 0 20px red, 0 0 30px orange; }
    }
    .firework {
      position: absolute;
      width: 6px;
      height: 6px;
      background: white;
      border-radius: 50%;
      animation: explode 1.5s ease-out infinite;
    }
    @keyframes explode {
      0% { transform: scale(1) translateY(0); opacity: 1; }
      100% { transform: scale(0.2) translateY(-150px); opacity: 0; }
    }
    audio {
      display: none;
    }
  </style>
</head>
<body>
  <div class="banner">
    <h1>WELCOME TO</h1>
    <h1>LÔ TÔ SHOW</h1>
    <h1>ĐOÀN LÔ TÔ DATADREAMERS</h1>
  </div>

  <!-- Fireworks Simulation -->
  <script>
    function createFirework() {
      const firework = document.createElement('div');
      firework.className = 'firework';
      firework.style.left = `${Math.random() * 100}vw`;
      firework.style.top = `${Math.random() * 100}vh`;
      firework.style.backgroundColor = `hsl(${Math.random() * 360}, 100%, 70%)`;
      document.body.appendChild(firework);
      setTimeout(() => document.body.removeChild(firework), 1500);
    }
    setInterval(createFirework, 300);
  </script>

  <!-- Background Music -->
  <audio autoplay loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
  </audio>
</body>
</html>

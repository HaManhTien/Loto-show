<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Welcome to Lô Tô Show</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: black;
      color: white;
      font-family: 'Arial', sans-serif;
      text-align: center;
      overflow: hidden;
    }

    h1, h2 {
      margin: 20px 0;
      font-weight: bold;
      text-shadow: 0 0 10px #fff, 0 0 20px #ff00ff;
    }

    h1 {
      font-size: 60px;
      color: #ffcc00;
    }

    h2 {
      font-size: 40px;
      color: #00ffff;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      z-index: -1;
    }
  </style>
</head>
<body>
  <h1>Welcome to<br>Lô Tô Show</h1>
  <h2>Đoàn Lô Tô DataDreamers</h2>

  <!-- Fireworks Canvas -->
  <canvas id="fireworks"></canvas>

  <!-- Firework Sound -->
  <audio id="fireworkSound" autoplay loop>
    <source src="https://www.soundjay.com/fireworks/fireworks-1.mp3" type="audio/mpeg">
  </audio>

  <!-- Fireworks JS -->
  <script src="https://cdn.jsdelivr.net/npm/fireworks-js@2.9.0/dist/fireworks.js"></script>
  <script>
    const container = document.body;
    const fireworks = new Fireworks(container, {
      rocketsPoint: 50,
      hue: { min: 0, max: 360 },
      delay: { min: 15, max: 30 },
      speed: 2,
      acceleration: 1.05,
      friction: 0.95,
      gravity: 1.5,
      particles: 90,
      trace: 3,
      explosion: 6,
      autoresize: true,
      brightness: { min: 50, max: 80 },
      decay: { min: 0.015, max: 0.03 },
      mouse: { click: false, move: false, max: 0 }
    });
    fireworks.start();
  </script>
</body>
</html>
